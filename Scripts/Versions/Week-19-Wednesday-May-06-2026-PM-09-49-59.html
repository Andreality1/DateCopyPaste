<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatted Timestamp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 95%;
            max-width: 600px;
        }
        h1 { 
            color: #bb86fc; 
            margin-bottom: 0.5rem; 
            font-weight: 600;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 1rem;
        }
        code {
            display: block;
            background: #000;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            color: #03dac6;
            font-size: 0.85rem;
            border: 1px solid #222;
        }
        .highlight {
            background-color: #2c2c2c;
            padding: 25px;
            border: 2px dashed #bb86fc;
            border-radius: 12px;
            cursor: pointer;
            user-select: all;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease;
        }
        .highlight:hover {
            background-color: #333;
        }
        .status {
            margin-top: 20px;
            color: #03dac6;
            font-weight: bold;
            visibility: hidden;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Timestamp Tool</h1>
    <p>Hyphenated Format Pattern:</p>
    <code>Week-X-Day-Month-DD-YYYY-AM/PM-hh-mm-ss</code>
    
    <div class="highlight" id="target">
        CLICK TO COPY TIMESTAMP
    </div>

    <div id="statusMsg" class="status">✓ TIMESTAMP COPIED</div>
</div>

<script>
    document.addEventListener('copy', (event) => {
        const now = new Date();

        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };

        const weekOfYear = getWeekNumber(now);
        const dayName = days[now.getDay()];
        const monthName = months[now.getMonth()];
        const dd = String(now.getDate()).padStart(2, '0');
        const yyyy = now.getFullYear();
        
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const hh = String(hours).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        // Logic: All separators replaced with [-]
        // Output Example: Week-19-Wednesday-May-06-2026-PM-09-47-54
        const formattedDate = `Week-${weekOfYear}-${dayName}-${monthName}-${dd}-${yyyy}-${ampm}-${hh}-${min}-${ss}`;

        event.clipboardData.setData('text/plain', formattedDate);
        event.preventDefault();

        const status = document.getElementById('statusMsg');
        status.style.visibility = 'visible';
        setTimeout(() => { status.style.visibility = 'hidden'; }, 2000);
    });

    document.getElementById('target').addEventListener('click', () => {
        document.execCommand('copy');
    });
</script>

</body>
</html>
